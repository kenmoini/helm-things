---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eip-test-{{ .name }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eip-reader
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups:
      - "k8s.ovn.org"
    resources:
      - egressips
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eip-test
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups:
      - "batch"
    resources:
      - jobs
    verbs:
      - get
      - create
      - delete
      - list
      - exec
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - exec
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eip-test
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eip-test
subjects:
  - kind: ServiceAccount
    name: eip-test-{{ .name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eip-test-reader
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: eip-reader
subjects:
  - kind: ServiceAccount
    name: eip-test-{{ .name }}